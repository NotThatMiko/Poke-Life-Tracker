services:
  db:
    image: postgres:16-alpine
    container_name: pixel-heart-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: habits
      POSTGRES_USER: habits
      POSTGRES_PASSWORD: habits_change_me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habits -d habits"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: pixel-heart-tracker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://habits:habits_change_me@db:5432/habits
      SEED_DEMO_DATA: "false"
    ports:
      - "5001:5000"

volumes:
  postgres_data:
